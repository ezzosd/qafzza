<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<meta name="description" content="تواصل مع فريق قفزة Qafza — للاستفسارات أو نشر فرص عمل.">
<title>اتصل بنا | قفزة Qafza</title>
<link rel="canonical" href="https://ezzosd.github.io/qafzza/contact.html">
<link rel="icon" href="logo.png" type="image/png">
<style>
body{margin:0;background:#f7f9fc;color:#18263c;font-family:Tahoma,Arial,sans-serif;line-height:1.9}
.wrap{width:min(680px,92%);margin:auto;padding:40px 0 60px}
header{background:#fff;border-bottom:1px solid #e4eaf2;padding:15px 0;margin-bottom:30px}
header .wrap{padding:0;display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{display:flex;align-items:center;gap:10px;color:#0b3470;font-weight:900;font-size:22px;text-decoration:none}
.brand img{width:38px;height:38px;border-radius:10px;background:#fff;padding:3px;box-shadow:0 4px 12px #0b34702b}
.back{color:#147ee5;font-size:14px;text-decoration:none;font-weight:700}
h1{color:#0b3470;font-size:30px;margin:0 0 10px}
p{color:#3b4b61;font-size:15px}
a{color:#147ee5}
form{margin-top:25px;background:#fff;border:1px solid #e4eaf2;border-radius:16px;padding:22px}
.fg{display:grid;gap:6px;margin-bottom:14px}
label{font-size:12px;font-weight:bold;color:#53647a}
input,textarea{width:100%;border:1px solid #dce4ef;border-radius:10px;padding:11px;outline:0;background:#fff;font-family:inherit;resize:vertical;box-sizing:border-box}
input:focus,textarea:focus{border-color:#147ee5;box-shadow:0 0 0 3px #147ee51c}
button{width:100%;border:0;border-radius:11px;padding:13px;font-weight:700;background:#147ee5;color:#fff;cursor:pointer;font-family:inherit;font-size:15px}
button:disabled{opacity:.6;cursor:not-allowed}
button:hover:not(:disabled){background:#096bd0}
.info{margin-top:20px;padding:16px;background:#eaf4ff;border-radius:12px;font-size:14px;color:#3b4b61}
footer{text-align:center;color:#8896a8;font-size:12px;margin-top:40px;padding-top:20px;border-top:1px solid #e4eaf2}
footer a{color:#147ee5;margin:0 6px}
#status{margin-top:12px;font-size:14px;text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="index.html"><img src="logo.png" alt="قفزة"> قفزة Qafza</a>
  <a class="back" href="index.html">← العودة للرئيسية</a>
</div></header>
<div class="wrap">
  <h1>اتصل بنا</h1>
  <p>هل لديك استفسار، اقتراح، أو ترغب في نشر فرصة عمل على «قفزة»؟ أرسل لنا رسالة وسنرد في أقرب وقت.</p>

  <form id="contactForm">
    <input type="hidden" name="access_key" value="ضع_مفتاح_Web3Forms_هنا">
    <input type="hidden" name="subject" value="رسالة جديدة من صفحة الاتصال — قفزة Qafza">
    <input type="hidden" name="from_name" value="قفزة Qafza — اتصل بنا">
    <div class="fg"><label for="cname">الاسم *</label><input id="cname" name="name" required autocomplete="name" placeholder="اسمك"></div>
    <div class="fg"><label for="cemail">البريد الإلكتروني *</label><input id="cemail" name="email" type="email" required autocomplete="email" placeholder="name@example.com"></div>
    <div class="fg"><label for="csubject">الموضوع</label><input id="csubject" name="topic" placeholder="مثال: نشر وظيفة، استفسار"></div>
    <div class="fg"><label for="cmsg">رسالتك *</label><textarea id="cmsg" name="message" rows="5" required placeholder="اكتب رسالتك هنا..."></textarea></div>
    <button type="submit" id="submitBtn">إرسال الرسالة</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>

  <div class="info">
    <strong>البريد المباشر:</strong> <a href="mailto:contact@example.com">contact@example.com</a><br>
    <strong>وقت الرد المتوقع:</strong> خلال 2–3 أيام عمل.
  </div>

  <footer>© <span id="year"></span> قفزة Qafza — <a href="index.html">الرئيسية</a> <a href="privacy.html">الخصوصية</a> <a href="terms.html">الشروط</a> <a href="about.html">من نحن</a></footer>
</div>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("contactForm").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "جارٍ الإرسال...";
  status.textContent = "";

  const payload = Object.fromEntries(new FormData(form).entries());
  try {
    const res = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message || "فشل الإرسال");
    status.style.color = "#15805d";
    status.textContent = "✓ تم إرسال رسالتك. شكرًا لتواصلك!";
    form.reset();
  } catch (err) {
    status.style.color = "#b02a37";
    status.textContent = "تعذّر الإرسال: " + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});
</script>
</body>
</html>
